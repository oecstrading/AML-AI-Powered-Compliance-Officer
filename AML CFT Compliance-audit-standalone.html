    *{box-sizing:border-box} body{margin:0;background:var(--paper);min-height:100vh}.app{display:grid;grid-template-columns:255px 1fr;min-height:100vh}.side{background:var(--ink);color:#fff;padding:28px 14px;display:flex;flex-direction:column}.brand{display:flex;gap:11px;align-items:center;padding:0 10px 28px}.seal{display:grid;place-items:center;width:35px;height:35px;border-radius:12px;background:rgba(200,156,75,.16);color:#f3d797;font-size:18px}.brand b,.serif{font-family:Georgia,"Times New Roman",serif}.brand b{font-size:19px}.brand small{display:block;color:#b7c7c0;font-size:10px;letter-spacing:.15em;margin-top:3px}.nav-label{margin:16px 10px 9px;color:#b7c7c0;font-size:10px;font-weight:800;letter-spacing:.16em}.nav button{width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#e7f0ea;padding:11px 12px;border-radius:12px;text-align:left;font-size:14px;cursor:pointer}.nav button:hover{background:#1e4d44}.nav button.active{background:#ddbd77;color:#173b34;font-weight:700}.side-footer{margin-top:auto;border-top:1px solid rgba(255,255,255,.14);padding:18px 10px 0;font-size:12px;color:#c7d5ce}.main{padding:34px clamp(18px,4vw,58px);max-width:1500px;width:100%;margin:0 auto}.top{display:flex;gap:20px;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:26px}.eyebrow{font-size:10px;letter-spacing:.16em;color:#a67c33;font-weight:800;margin:0 0 10px}.top h1{font-size:36px;margin:0;color:var(--ink);line-height:1.1}.top p{margin:9px 0 0;color:var(--muted);max-width:690px;line-height:1.55;font-size:14px}.top-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;min-width:260px}.button,button{font:inherit}.button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;color:var(--ink);cursor:pointer;font-size:13px;font-weight:650}.button:hover{background:#f3f5f1}.button.primary{border-color:var(--ink);background:var(--ink);color: der-color:#eebdb9}.badge.blue{background:#edf1f9;color:#466083;border-color:#ccd7ec}.empty{min-height:260px;display:grid;place-items:center;text-align:center;border:1px dashed #cbd3cc;border-radius:var(--radius);background:rgba(255,255,255,.65);padding:35px}.empty .icon{font-size:30px;color:#236054}.empty h2{font-size:21px;margin:13px 0 6px}.empty p{color:var(--muted);max-width:480px;line-height:1.55;font-size:14px;margin:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:18px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:750;color:#44524b}.field input,.field select,.field textarea,.role-select{width:100%;border:1px solid #d8ddd8;border-radius:9px;background:#fff;color:#21352e;padding:10px 11px;font:inherit;font-size:13px;outline:none}.field textarea{min-height:95px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#5a8b7f;box-shadow:0 0 0 3px rgba(63,119,103,.12)}.table-wrap{overflow:auto;margin-top:15px}.data-table{width:100%;border-collapse:collapse;font-size:12px}.data-table th,.data-table td{text-align:left;padding:11px;border-bottom:1px solid #edf0ec;vertical-align:top}.data-table th{font-size:10px;letter-spacing:.11em;color:#6b746e;text-transform:uppercase;background:#fafbf9}.data-table textarea{width:100%;min-width:190px;min-height:52px;border:1px solid #e0e4e0;border-radius:7px;padding:7px;font:inherit;font-size:12px}.data-table select{border:1px solid #d8ddd8;border-radius:7px;padding:7px;background:#fff;font-size:12px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:16px 0}.upload{border:1px dashed #a7c5b4;border-radius:14px;background:#edf5ef;padding:20px;text-align:center;cursor:pointer;display:block}.upload:hover{background:#e7f1e9}.upload input{display:none}.mapping-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:15px}.mapping{padding:10px;border:1px solid #e1e5e1;border-radius:9px;background:#fbfcfa}.mapping label{display:block;font-size:11px;font-weight:750;margin-bottom:6px;color:#43534c}.mapping select{width:100%;border:1px solid #d9ded9;border-radius:7px;padding:7px;background:#fff}.report-outline{counter-reset:section;margin:17px 0 0;padding:0;list-style:none}.report-outline li{counter-increment:section;display:flex;gap:10px;align-items:flex-start;padding:9px 0;font-size:13px;color:#4f5e57;border-bottom:1px solid #eef1ed}.report-outline li:before{content:counter(section);display:grid;place-items:center;width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:#e8f0ea;color:#1d554b;font-size:11px;font-weight:800}.approval{display:grid;grid-template-columns:42px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid #edf0ec}.approval:last-child{border-bottom:0}.approval-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:#e8f0ea;color:#1d554b}.small{font-size:11px;color:var(--muted);line-height:1.5}.guide-answer{white-space:pre-wrap;background:#f6f8f5;border:1px solid #e1e7e1;padding:14px;border-radius:10px;line-height:1.6;font-size:13px;color:#31463d}.modal{position:fixed;inset:0;background:rgba(10,31,25,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.open{display:flex}.modal-card{background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.toast{position:fixed;right:20px;bottom:20px;background:#173b34;color:#fff;padding:12px 15px;border-radius:10px;font-size:13px;box-shadow:0 8px 25px rgba(0,0,0,.18);display:none;z-index:10}.toast.show{display:block}.footer-note{margin-top:20px;font-size:11px;color:#707a74;line-height:1.55}.divider{height:1px;background:#edf0ec;margin:17px 0}@media(max-width:930px){.app{grid-template-columns:1fr}.side{padding:13px;position:sticky;top:0;z-index:4;display:block}.brand{padding:0 5px 8px}.nav{display:flex;gap:5px;overflow:auto}.nav-label,.side-footer{display:none}.nav button{width:auto;white-space:nowrap;padding:8px 10px}.main{padding:24px 16px}.top{flex-direction:column}.top-actions{justify-content:flex-start}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.layout-two{grid-template-columns:1fr}.mapping-grid,.form-grid{grid-template-columns:1fr}}@media(max-width:500px){.cards{grid-template-columns:1fr}.top h1{font-size:30px}.top-actions{min-width:auto}.main{padding:20px 13px}}
  </style>
  <style>
    .auth-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 16% 18%,rgba(200,156,75,.18),transparent 34%),var(--paper)}.auth-card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:0 22px 70px rgba(17,52,45,.13)}.auth-mark{display:grid;place-items:center;width:52px;height:52px;border-radius:17px;background:var(--ink);color:#f3d797;font-size:24px;margin-bottom:21px}.auth-card h1{font:700 34px Georgia,serif;color:var(--ink);margin:0}.auth-card p{color:var(--muted);line-height:1.6;font-size:14px}.auth-card form{display:grid;gap:14px;margin-top:23px}.auth-card label{display:grid;gap:7px;font-size:12px;font-weight:750;color:#44524b}.auth-card input{border:1px solid #d8ddd8;border-radius:10px;padding:12px;font:inherit}.auth-card input:focus{outline:none;border-color:#5a8b7f;box-shadow:0 0 0 3px rgba(63,119,103,.12)}.auth-boundary{margin-top:20px;padding:13px 14px;border-radius:12px;background:#fff8e7;border:1px solid #f0dca5;color:#72500d;font-size:12px;line-height:1.55}.authoring-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}.authoring-grid textarea{width:100%;min-height:108px;border:1px solid #d8ddd8;border-radius:9px;padding:10px;font:inherit;font-size:13px;resize:vertical}.authoring-grid h3{font:700 14px Georgia,serif;color:var(--ink);margin:0 0 5px}.authoring-grid p{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 8px}@media(max-width:620px){.auth-card{padding:26px 22px}.authoring-grid{grid-template-columns:1fr}}

</head>
<body>
<div id="app"></div><div id="modal" class="modal"></div><div id="toast" class="toast"></div>
<script>
(() => {
  "use strict";
  const KEY="manu-audit-standalone-v1",AUTH_KEY="manu-audit-standalone-auth-v1",SESSION_KEY="manu-audit-standalone-unlocked-v1";
  const controlCatalog=[
    ["GOV-01","Governance & oversight","Board-approved AML/CFT programme","Confirm the programme is approved, current, and assigned to accountable owners."],
    ["GOV-02","Governance & oversight","Designated compliance officer","Confirm documented authority, appointment, and reporting lines."],
    ["CDD-01","Customer due diligence","Customer identification and verification","Verify identity evidence is obtained and retained."],
    ["CDD-02","Customer due diligence","Beneficial ownership review","Confirm ownership and control information is identified and refreshed."],
    ["MON-01","Monitoring & reporting","Ongoing transaction monitoring","Confirm monitoring controls operate and are evidenced."],
    ["MON-02","Monitoring & reporting","Suspicious activity escalation","Confirm escalation, approval, and filing procedures are documented."],
    ["REC-01","Record keeping","Records retention framework","Confirm required CDD, transaction, and reporting records are retained."],
    ["TRN-01","Training & awareness","Role-appropriate AML/CFT training","Confirm current, complete, and evidenced training."],
    ["RSK-01","Risk management","Enterprise AML/CFT risk assessment","Confirm risk assessment informs control design and monitoring."],
  ];
  const formats={
    universal:{name:"Universal AML/CFT Audit Report",regulator:"Cross-regulator working format",sections:["Executive summary","Entity profile","Governance and compliance framework","Control testing","Deficiencies and remediation","Workpaper register","Auditor certification"]},
    fsrc_st_kitts_nevis:{name:"FSRC — St. Kitts & Nevis",regulator:"Financial Services Regulatory Commission",sections:["Cover and entity licensing profile","Compliance / reporting officer governance","Risk-based AML/CFT/CPF programme","Customer due diligence and beneficial ownership","Monitoring and suspicious activity escalation","Control findings and remediation","Management representation and certification"]},
    fsra_saint_lucia:{name:"FSRA / FIA — Saint Lucia",regulator:"Financial Services Regulatory Authority / Financial Intelligence Authority",sections:["Entity and supervisory profile","AML/CFT compliance programme","Independent audit scope","CDD and record-keeping testing","Transaction monitoring and suspicious activity reporting","Training and awareness","Findings, actions, and auditor certification"]},
    garfin_grenada:{name:"GARFIN — Grenada",regulator:"Grenada Authority for the Regulation of Financial Institutions",sections:["Institution profile and reporting period","Governance and risk management","Customer and beneficial-owner controls","Monitoring, reporting, and record retention","Training and internal controls","Deficiency remediation matrix","Management and auditor attestation"]},
    eccb_eastern_caribbean:{name:"ECCB — Eastern Caribbean Review",regulator:"Eastern Caribbean Central Bank-aligned review",sections:["Institution profile and prudential context","Board oversight and compliance governance","AML/CFT risk assessment and policy framework","CDD, beneficial ownership, and screening controls","Transaction monitoring and suspicious activity escalation","Training, record retention, and internal assurance","Supervisory findings and action plan"]},
    cfatf_fatf:{name:"CFATF / FATF Best-Practice Review",regulator:"Risk-based best-practice assessment",sections:["Methodology and scope","Risk understanding and governance","Preventive measures","Suspicious transaction reporting","Transparency and beneficial ownership","Effectiveness observations","Priority remediation roadmap"]},
    uae_benchmark:{name:"UAE DNFBP Benchmark Review",regulator:"UAE-style benchmark framework",sections:["Business risk assessment","Policies, procedures, and governance","Customer due diligence and screening","High-risk and enhanced due diligence","Reporting and record retention","Staff awareness and internal controls","Benchmark gaps and action plan"]}
  };
  const ifrsSmeBlocks=[
    ["Key considerations","State the report purpose, reporting period, intended users, audit scope, material control themes, and any boundaries on the procedures performed."],
    ["Additional considerations","Record source-data constraints, key assumptions, significant management representations, and matters requiring follow-up outside this report."],
    ["Disclosure and evidence register","Summarise the control criteria, workpaper references, data-quality exceptions, and supporting disclosures needed to understand the conclusions."],
    ["KPI and outcome measures","Document the tested population, completion rate, exception rate, open findings by severity, remediation progress, and other locally relevant measures."],
    ["Governance and accountability","Identify the board or committee oversight, accountable compliance owner, management response, and sign-off responsibilities."],
    ["Conclusion and action plan","Set out the overall conclusion, priority actions, named owners, target dates, validation method, and report distribution restrictions."]
  ];
  const importSchemas={
    customers:["CustomerID","FullName","DOB","Nationality","ID_Type","ID_Number","ID_Expiry","Address","Risk_Rating"],
    transactions:["Date","Transaction_ID","CustomerID","Amount (XCD)","Currency","Type","Counterparty","Jurisdiction"],
    employees:["EmployeeID","FullName","Department","Position","Hire_Date","Training_Completed_Flag"],
    training:["Training_Date","EmployeeID","Topic","Completion_Status"],
    str:["STR_Ref","Filing_Date","CustomerID","Transaction_Ref","Suspicion_Nature","Threshold_Flag"]
  };
  const titles={dashboard:["Compliance intelligence","Audit command centre","A local, self-contained view of audit work, remediation exposure, and evidence."],engagements:["Engagement portfolio","Audit engagements","Create and retain AML/CFT engagements in this browser only."],checklist:["Control testing","Compliance checklist","Record audit conclusions and evidence locally."],findings:["Remediation oversight","Deficiency tracker","Prioritise gaps and record remediation progress."],workpapers:["Evidence library","Local workpapers","Store small supporting files in local browser storage."],imports:["Source-data control","Bulk data import","Map CSV or XLSX columns locally, then validate before import."],reports:["Reporting suite","Compliance reports","Use guided regulator-format report authoring and local approvals."],guide:["Offline drafting support","Manu guidance notes","A deterministic offline assistant, not a hosted AI service."],settings:["Local workspace","Backup & capability boundaries","Export local data and understand standalone limits."]};
  let state=load(),view="dashboard",pending=null,access=loadAccess(),sessionUnlocked=sessionStorage.getItem(SESSION_KEY)==="1";
  function uid(prefix){return prefix+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
  function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return normalize(s||{});}catch{return normalize({});}}
  function loadAccess(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||"null");}catch{return null;}}
  function hasPassword(){return Boolean(access?.salt&&access?.verifier);}
  function bytesToBase64(bytes){return btoa(String.fromCharCode(...bytes));}
  function base64ToBytes(value){return Uint8Array.from(atob(value),c=>c.charCodeAt(0));}
  async function passwordVerifier(password,salt){if(!globalThis.crypto?.subtle)throw new Error("Secure local password controls are unavailable in this browser.");const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveBits"]);const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:base64ToBytes(salt),iterations:150000,hash:"SHA-256"},material,256);return bytesToBase64(new Uint8Array(bits));}
  async function setPassword(password){const salt=new Uint8Array(16);crypto.getRandomValues(salt);const encoded=bytesToBase64(salt);access={salt:encoded,verifier:await passwordVerifier(password,encoded)};localStorage.setItem(AUTH_KEY,JSON.stringify(access));sessionUnlocked=true;sessionStorage.setItem(SESSION_KEY,"1");}
  async function verifyPassword(password){return hasPassword()&&(await passwordVerifier(password,access.salt))===access.verifier;}
  function normalize(s){return {role:s.role||"admin",engagements:Array.isArray(s.engagements)?s.engagements:[],selectedId:s.selectedId||null};}
  function save(){localStorage.setItem(KEY,JSON.stringify(state));render();}
  function selected(){return state.engagements.find(e=>e.id===state.selectedId)||null;}
  function esc(value){return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));}
  function pretty(v){return String(v||"").replaceAll("_"," ").replace(/\b\w/g,x=>x.toUpperCase());}
  function tone(v){return ["pass","closed","approved","completed"].includes(v)?"good":["fail","critical","rejected"].includes(v)?"bad":["high","medium","pending_approval","in_progress","fieldwork"].includes(v)?"warn":"blue";}
  function date(v){return v?new Date(v).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}):"Not set";}
  function risk(e){const weights={critical:40,high:25,medium:12,low:4};return Math.min(100,e.findings.filter(f=>f.status!=="closed").reduce((n,f)=>n+(weights[f.severity]||0),0));}
  function toast(text){const el=document.querySelector("#toast");el.textContent=text;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),3200);}
  function newEngagement(data){const id=uid("eng");return {id,name:data.name,entityName:data.entityName,entityType:data.entityType,jurisdiction:data.jurisdiction,startDate:data.startDate,endDate:data.endDate||"",status:"planning",format:"universal",reportStatus:"draft",narrative:"",controls:controlCatalog.map(c=>({id:uid("ctl"),code:c[0],category:c[1],title:c[2],description:c[3],status:"not_assessed",note:""})),findings:[],workpapers:[],imports:[],approvals:[]};}
  function shell(content){const nav=[["dashboard","▦","Overview"],["engagements","▤","Engagements"],["checklist","☷","Controls"],["findings","△","Findings"],["workpapers","▱","Workpapers"],["imports","▤","Data import"],["reports","▧","Reports"],["guide","✦","Manu guide"],["settings","⚙","Backup & limits"]];const t=titles[view];return `<div class="app"><aside class="side"><div class="brand"><span class="seal">◈</span><div><b>The AI AML/CFT Compliance Auditor</b><small>STANDALONE WORKSPACE</small></div></div><div class="nav-label">LOCAL AUDIT MANAGEMENT</div><nav class="nav">${nav.map(n=>`<button class="${view===n[0]?"active":""}" data-nav="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join("")}</nav><div class="side-footer">Standalone edition<br><span style="color:#f3d797">Local data only</span></div></aside><main class="main"><header class="top"><div><div class="eyebrow">${t[0]}</div><h1 class="serif">${t[1]}</h1><p>${t[2]}</p></div><div class="top-actions"><select id="engagementPick" class="role-select"><option value="">No engagement selected</option>${state.engagements.map(e=>`<option value="${e.id}" ${e.id===state.selectedId?"selected":""}>${esc(e.name)}</option>`).join("")}</select><select id="rolePick" class="role-select" title="Local demonstration role"><option value="admin" ${state.role==="admin"?"selected":""}>Local administrator</option><option value="auditor" ${state.role==="auditor"?"selected":""}>Local auditor</option></select>${view!=="engagements"?`<button class="button primary" data-nav="engagements">＋ New engagement</button>`:""}</div></header>${content}</main></div>`}
  function empty(icon,title,text,action){return `<div class="empty"><div><div class="icon">${icon}</div><h2 class="serif">${title}</h2><p>${text}</p>${action?`<button class="button primary" style="margin-top:16px" data-nav="${action}">Create an engagement</button>`:""}</div></div>`}
  function render(){if(!sessionUnlocked){document.querySelector("#app").innerHTML=lockScreen();bindLock();return;}let c="";if(view==="dashboard")c=dashboard();if(view==="engagements")c=engagements();if(view==="checklist")c=checklist();if(view==="findings")c=findings();if(view==="workpapers")c=workpapers();if(view==="imports")c=imports();if(view==="reports")c=reports()+ifrsSmePanel();if(view==="guide")c=guide();if(view==="settings")c=settings()+securityPanel();document.querySelector("#app").innerHTML=shell(c);bind();}
  function lockScreen(){const setup=!hasPassword();return `<div class="auth-screen"><section class="auth-card"><div class="auth-mark">◈</div><div class="eyebrow">${setup?"LOCAL WORKSPACE SETUP":"LOCAL WORKSPACE LOCKED"}</div><h1>${setup?"Protect this workspace":"Unlock The AI AML/CFT Compliance Auditor"}</h1><p>${setup?"Create a password to gate this browser-local workspace. The password is not uploaded or sent to a server.":"Enter the local workspace password to open browser-held audit records."}</p><form id="${setup?"passwordSetup":"passwordUnlock"}"><label>${setup?"Create password (at least 12 characters)":"Password"}<input type="password" name="password" autocomplete="${setup?"new-password":"current-password"}" required minlength="12"></label>${setup?`<label>Confirm password<input type="password" name="confirmPassword" autocomplete="new-password" required minlength="12"></label>`:""}<button class="button primary" type="submit">${setup?"Create protected workspace":"Unlock workspace"}</button></form>${setup?"":`<button class="button" data-local-action="reset-workspace" style="margin-top:13px">Forgot password? Reset local workspace</button>`}<div class="auth-boundary"><b>Important local-security boundary:</b> this password gate deters casual access in this browser profile. It is not a substitute for encrypted enterprise storage or server-side identity controls. A forgotten password can only be reset by deleting local workspace data.</div></section></div>`;}
  function resetWorkspace(){if(!confirm("This deletes the local password and all browser-held audit data. Continue?"))return;localStorage.removeItem(KEY);localStorage.removeItem(AUTH_KEY);sessionStorage.removeItem(SESSION_KEY);access=null;state=normalize({});sessionUnlocked=false;view="dashboard";render();}
  function bindLock(){const setup=document.querySelector("#passwordSetup"),unlock=document.querySelector("#passwordUnlock");if(setup)setup.onsubmit=async event=>{event.preventDefault();const d=Object.fromEntries(new FormData(setup));if(d.password!==d.confirmPassword){toast("The two passwords do not match.");return;}if(String(d.password).length<12){toast("Use at least 12 characters.");return;}try{await setPassword(d.password);render();toast("Local password protection is enabled.");}catch(error){toast(error.message||"This browser cannot create the local password gate.");}};if(unlock)unlock.onsubmit=async event=>{event.preventDefault();const password=new FormData(unlock).get("password");try{if(!(await verifyPassword(password))){toast("The password is not correct.");return;}sessionUnlocked=true;sessionStorage.setItem(SESSION_KEY,"1");render();}catch(error){toast(error.message||"This browser cannot unlock the local workspace.");}};document.querySelectorAll('[data-local-action="reset-workspace"]').forEach(button=>button.onclick=resetWorkspace);}
  function ifrsSmePanel(){const e=selected(),draft=e.reportAuthoring||{};return `<section class="panel" style="margin-top:18px"><div class="eyebrow">IFRS SME-INSPIRED AUTHORING WORKSHEET</div><h2 class="serif">Structured disclosures and completion prompts</h2><p class="sub">This guided structure adapts the supplied IFRS SME report-writer approach to AML/CFT reporting. It supports report preparation but does not make the report a set of IFRS financial statements.</p><div class="authoring-grid">${ifrsSmeBlocks.map(([title,prompt],index)=>`<div class="mapping"><h3>${esc(title)}</h3><p>${esc(prompt)}</p><textarea data-ifrs-field="block${index}" placeholder="Complete this report content locally…">${esc(draft[`block${index}`]||"")}</textarea></div>`).join("")}</div></section>`;}
  function securityPanel(){return `<section class="panel" style="margin-top:18px"><div class="eyebrow">LOCAL ACCESS CONTROL</div><h2 class="serif">Password-gated workspace</h2><p class="sub">This browser profile is protected by a local password gate. The password verifier remains in this browser and is excluded from workspace backups.</p><div class="toolbar"><button class="button primary" data-local-action="lock-workspace">Lock workspace now</button><button class="button" data-local-action="change-password">Change local password</button><button class="button danger" data-local-action="reset-workspace">Reset password and delete local workspace</button></div><div class="notice warn">A local password gate cannot replace encrypted storage, server-enforced permissions, or a multi-user identity provider. Anyone with full access to this browser profile may still delete local browser data; keep encrypted external backups where required.</div></section>`;}
  function dashboard(){const es=state.engagements,all=es.flatMap(e=>e.findings),controls=es.flatMap(e=>e.controls),tested=controls.filter(c=>c.status!=="not_assessed").length,done=controls.filter(c=>["pass","not_applicable"].includes(c.status)).length,avg=es.length?Math.round(es.reduce((n,e)=>n+risk(e),0)/es.length):0;return `<div class="cards"><div class="card"><div class="metric-icon">▣</div><div class="metric-label">OPEN ENGAGEMENTS</div><div class="metric-value">${es.filter(e=>e.status!=="completed").length}</div><div class="metric-help">Local audit portfolio</div></div><div class="card"><div class="metric-icon">☷</div><div class="metric-label">COMPLETED CHECKS</div><div class="metric-value">${done}</div><div class="metric-help">${tested?`${Math.round(done/tested*100)}% of assessed controls`:"No control testing yet"}</div></div><div class="card"><div class="metric-icon">△</div><div class="metric-label">OPEN FINDINGS</div><div class="metric-value">${all.filter(f=>f.status!=="closed").length}</div><div class="metric-help">Awaiting remediation</div></div><div class="card"><div class="metric-icon">◎</div><div class="metric-label">AVERAGE RISK SCORE</div><div class="metric-value">${avg}/100</div><div class="metric-help">Local engagement exposure</div></div></div><div class="layout-two"><section class="panel"><div class="row between"><div><div class="eyebrow">PORTFOLIO</div><h2 class="serif">Active engagements</h2></div><span class="badge">${es.length} total</span></div>${es.length?`<div class="stack" style="margin-top:10px">${es.slice(0,6).map(e=>`<div class="list-item row"><div class="metric-icon">▦</div><div class="grow"><div class="title">${esc(e.name)}</div><div class="meta">${esc(e.entityName)} · ${esc(e.jurisdiction)}</div></div><span class="badge ${tone(e.status)}">${pretty(e.status)}</span><b style="color:var(--ink)">${risk(e)}</b></div>`).join("")}</div>`:`<div class="empty" style="min-height:210px;margin-top:16px"><div><div class="icon">▦</div><h2 class="serif">Your portfolio is ready</h2><p>Create a local engagement to begin control testing, reporting, and evidence retention.</p><button class="button primary" data-nav="engagements" style="margin-top:16px">Create an engagement</button></div></div>`}</section><section class="panel" style="background:var(--ink);color:#fff"><div class="eyebrow" style="color:#ebcf91">STANDALONE MODE</div><h2 class="serif" style="color:#fff">No server required</h2><p style="color:#c7d5ce;font-size:14px;line-height:1.6">This file stores information in this browser. Export a backup regularly before clearing browser data or moving to another device.</p><div class="divider" style="background:rgba(255,255,255,.14)"></div><p class="small" style="color:#c7d5ce">The local role selector controls the in-file workflow only. It is not a substitute for a secured multi-user identity system.</p><button class="button gold" data-nav="settings" style="margin-top:12px">Open backup controls</button></section></div>`}
  function engagements(){return `<section class="panel"><div class="row between"><div><div class="eyebrow">CREATE & MANAGE</div><h2 class="serif">New audit engagement</h2><p class="sub">A control programme is created automatically and saved to this browser.</p></div></div><form id="engagementForm" class="form-grid"><div class="field"><label>Engagement name *</label><input name="name" required placeholder="2026 AML/CFT Independent Audit"></div><div class="field"><label>Regulated entity *</label><input name="entityName" required placeholder="Entity legal name"></div><div class="field"><label>Entity type *</label><select name="entityType" required><option value="Money Services Business">Money Services Business</option><option>Credit Union</option><option>Law Firm / DNFBP</option><option>Trust & Corporate Service Provider</option><option>Insurance Company</option><option>Other regulated entity</option></select></div><div class="field"><label>Jurisdiction *</label><input name="jurisdiction" required placeholder="St. Kitts & Nevis"></div><div class="field"><label>Start date *</label><input type="date" name="startDate" required></div><div class="field"><label>Target close date</label><input type="date" name="endDate"></div><div class="field full"><button class="button primary" type="submit">Create local engagement</button></div></form></section><section class="panel" style="margin-top:18px"><div class="eyebrow">ENGAGEMENT REGISTER</div><h2 class="serif">Stored locally</h2>${state.engagements.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Engagement</th><th>Entity</th><th>Status</th><th>Risk</th><th></th></tr></thead><tbody>${state.engagements.map(e=>`<tr><td><b>${esc(e.name)}</b><div class="meta">${esc(e.jurisdiction)}</div></td><td>${esc(e.entityName)}<div class="meta">${esc(e.entityType)}</div></td><td><select data-status-eng="${e.id}"><option ${e.status==="planning"?"selected":""}>planning</option><option ${e.status==="fieldwork"?"selected":""}>fieldwork</option><option ${e.status==="review"?"selected":""}>review</option><option ${e.status==="completed"?"selected":""}>completed</option></select></td><td><b>${risk(e)}/100</b></td><td><button class="button" data-select="${e.id}">Open</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="sub" style="margin-top:16px">No local engagements have been created.</p>`}</section>`}
  function checklist(){const e=selected();if(!e)return empty("☷","Choose an engagement","Select or create an engagement before documenting control testing.","engagements");const cats=[...new Set(e.controls.map(c=>c.category))];return `<div class="notice"><b>${esc(e.name)}</b><br>Record a conclusion and retain a concise evidence note. All changes are kept locally in this browser.</div><div class="stack" style="margin-top:18px">${cats.map(cat=>`<section class="panel"><div class="eyebrow">${esc(cat)}</div><h2 class="serif">${esc(cat)}</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>Ref</th><th>Control</th><th>Conclusion</th><th>Evidence note</th></tr></thead><tbody>${e.controls.filter(c=>c.category===cat).map(c=>`<tr><td><b style="color:#a67c33">${c.code}</b></td><td><b>${esc(c.title)}</b><div class="meta">${esc(c.description)}</div></td><td><select data-control-status="${c.id}">${["not_assessed","pass","fail","not_applicable"].map(s=>`<option value="${s}" ${c.status===s?"selected":""}>${pretty(s)}</option>`).join("")}</select></td><td><textarea data-control-note="${c.id}" placeholder="Add evidence note…">${esc(c.note)}</textarea></td></tr>`).join("")}</tbody></table></div></section>`).join("")}</div>`}
  function findings(){const e=selected();if(!e)return empty("△","Choose an engagement","Select an engagement to record deficiencies and remediation.","engagements");return `<div class="layout-two"><section class="panel"><div class="eyebrow">LOG DEFICIENCY</div><h2 class="serif">${esc(e.name)}</h2><form id="findingForm" class="form-grid"><div class="field"><label>Reference *</label><input name="reference" required placeholder="FND-001"></div><div class="field"><label>Severity *</label><select name="severity"><option value="medium">Medium</option><option value="critical">Critical</option><option value="high">High</option><option value="low">Low</option></select></div><div class="field full"><label>Finding title *</label><input name="title" required placeholder="CDD evidence is not consistently retained"></div><div class="field full"><label>Observation and recommendation *</label><textarea name="summary" required placeholder="Describe the condition, evidence, impact, and recommended action."></textarea></div><div class="field"><label>Remediation owner</label><input name="owner" placeholder="Compliance Officer"></div><div class="field"><label>Target date</label><input type="date" name="dueDate"></div><div class="field full"><button class="button primary">Save deficiency</button></div></form></section><section class="panel"><div class="eyebrow">RISK EXPOSURE</div><h2 class="serif">Risk score ${risk(e)}/100</h2><p class="sub">Open critical, high, medium, and low findings drive the local score.</p><div class="notice dark" style="margin-top:17px">This score is a simple local prioritisation indicator, not a regulatory risk-rating model.</div></section></div><section class="panel" style="margin-top:18px"><div class="eyebrow">DEFICIENCY REGISTER</div><h2 class="serif">Remediation history</h2>${e.findings.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Reference</th><th>Finding</th><th>Severity</th><th>Owner / due</th><th>Status</th></tr></thead><tbody>${e.findings.map(f=>`<tr><td><b style="color:#a67c33">${esc(f.reference)}</b></td><td><b>${esc(f.title)}</b><div class="meta">${esc(f.summary)}</div></td><td><span class="badge ${tone(f.severity)}">${f.severity}</span></td><td>${esc(f.owner||"Unassigned")}<div class="meta">${date(f.dueDate)}</div></td><td><select data-finding-status="${f.id}">${["open","in_progress","pending_validation","closed"].map(s=>`<option value="${s}" ${f.status===s?"selected":""}>${pretty(s)}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div>`:`<p class="sub" style="margin-top:16px">No findings are recorded for this engagement.</p>`}</section>`}
  function workpapers(){const e=selected();if(!e)return empty("▱","Choose an engagement","Select an engagement to keep small supporting files locally.","engagements");return `<section class="panel"><div class="eyebrow">LOCAL EVIDENCE LIBRARY</div><h2 class="serif">Workpapers for ${esc(e.name)}</h2><p class="sub">Files are saved as browser-local data. Keep files below 1 MB and export a backup regularly.</p><label class="upload" style="margin-top:18px">▱<br><b>Choose a supporting workpaper</b><br><span class="small">PDF, Word, spreadsheet, image, or text file (max. 1 MB)</span><input id="workpaperFile" type="file"></label></section><section class="panel" style="margin-top:18px"><div class="eyebrow">EVIDENCE REGISTER</div><h2 class="serif">Stored files</h2>${e.workpapers.length?`<div class="stack" style="margin-top:12px">${e.workpapers.map(w=>`<div class="list-item row"><div class="metric-icon">▱</div><div class="grow"><div class="title">${esc(w.name)}</div><div class="meta">${esc(w.type||"file")} · ${(w.size/1024).toFixed(1)} KB · ${date(w.addedAt)}</div></div><button class="button" data-download-workpaper="${w.id}">Download</button><button class="button" data-delete-workpaper="${w.id}">Remove</button></div>`).join("")}</div>`:`<p class="sub" style="margin-top:16px">No workpapers have been saved locally.</p>`}</section>`}
  function imports(){const e=selected();if(!e)return empty("▤","Choose an engagement","Select an engagement before importing locally stored source data.","engagements");const type=pending?.type||"customers";return `<section class="panel"><div class="eyebrow">LOCAL BULK IMPORT</div><h2 class="serif">Map and validate source data</h2><p class="sub">CSV and XLSX files are processed in your browser. No file is sent to a server. XLS files should be saved as XLSX or CSV first.</p><div class="toolbar"><select id="importType" class="role-select" style="max-width:240px">${Object.keys(importSchemas).map(k=>`<option value="${k}" ${k===type?"selected":""}>${pretty(k)}</option>`).join("")}</select><button class="button" id="downloadImportTemplate">Download CSV template</button></div><label class="upload">⇧<br><b>Select CSV or XLSX file</b><br><span class="small">A required-field mapping review appears before records are added.</span><input id="importFile" type="file" accept=".csv,.xlsx"></label>${pending?mappingPanel(pending):""}</section><section class="panel" style="margin-top:18px"><div class="eyebrow">IMPORT QUALITY REGISTER</div><h2 class="serif">Validation history</h2>${e.imports.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>File</th><th>Register</th><th>Valid</th><th>Exceptions</th><th>Imported</th></tr></thead><tbody>${e.imports.map(i=>`<tr><td><b>${esc(i.name)}</b><div class="meta">${i.source}</div></td><td>${pretty(i.type)}</td><td><span class="badge good">${i.validRows}</span></td><td>${i.issues.length?`<span class="badge warn">${i.issues.length}</span><div class="meta">${esc(i.issues.slice(0,2).join("; "))}</div>`:`<span class="badge good">0</span>`}</td><td>${date(i.importedAt)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="sub" style="margin-top:16px">No imports have been registered for this engagement.</p>`}</section>`}
  function mappingPanel(p){const req=importSchemas[p.type];return `<div class="panel" style="margin-top:18px;background:#fafbf9"><div class="eyebrow">FIELD MAPPING REVIEW</div><h3 class="serif">${esc(p.name)}</h3><p class="sub">Map every required field. ${p.rows.length} source row${p.rows.length===1?"":"s"} detected.</p><div class="mapping-grid">${req.map(f=>`<div class="mapping"><label>${f} *</label><select data-map-field="${esc(f)}"><option value="">Select source column</option>${p.columns.map(c=>`<option value="${esc(c)}" ${p.map[f]===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>`).join("")}</div><div class="toolbar"><button class="button primary" id="confirmImport">Validate and import</button><button class="button" id="cancelImport">Cancel</button></div></div>`}
  function reports(){const e=selected();if(!e)return empty("▧","Choose an engagement","Select an engagement to create a local regulator-format report.","engagements");const f=formats[e.format]||formats.universal;return `<div class="layout-two"><section class="panel"><div class="eyebrow">GUIDED REPORT AUTHORING</div><h2 class="serif">${esc(f.name)}</h2><p class="sub">${esc(f.regulator)}</p><div class="field" style="margin-top:18px"><label>Report format</label><select id="reportFormat">${Object.entries(formats).map(([id,v])=>`<option value="${id}" ${e.format===id?"selected":""}>${esc(v.name)}</option>`).join("")}</select></div><ol class="report-outline">${f.sections.map(s=>`<li>${esc(s)}</li>`).join("")}</ol><div class="notice warn" style="margin-top:17px"><b>Review control:</b> this is an editable local working template. Verify current regulator filing and legal requirements before external use.</div><div class="toolbar"><button class="button primary" id="downloadReport">Download report HTML</button><button class="button" id="printReport">Print / save as PDF</button></div></section><section class="panel" style="background:var(--ink);color:#fff"><div class="eyebrow" style="color:#ebcf91">APPROVAL CONTROL</div><h2 class="serif" style="color:#fff">${pretty(e.reportStatus)}</h2><p style="color:#c7d5ce;font-size:13px;line-height:1.6">Auditors submit a named local attestation. The local administrator role can approve or reject and create an append-only entry in this browser.</p><div class="toolbar">${e.reportStatus!=="pending_approval"&&e.reportStatus!=="approved"?`<button class="button gold" id="submitReport">Submit for approval</button>`:""}${state.role==="admin"&&e.reportStatus==="pending_approval"?`<button class="button gold" data-report-decision="approved">Approve / sign</button><button class="button" data-report-decision="rejected">Reject</button>`:""}</div><div class="divider" style="background:rgba(255,255,255,.14)"></div><p class="small" style="color:#c7d5ce">A local attestation is not a qualified electronic signature and is not tamper-proof against a user with browser storage access.</p></section></div><section class="panel" style="margin-top:18px"><div class="eyebrow">REPORT NARRATIVE</div><h2 class="serif">Executive summary prompt</h2><p class="sub">Write the scope, key findings, conclusion, and priority actions. This follows the guided authoring pattern of the supplied report writer.</p><textarea id="reportNarrative" style="width:100%;min-height:150px;margin-top:16px;border:1px solid #d8ddd8;border-radius:9px;padding:11px;font:inherit;font-size:13px" placeholder="Summarise audit scope, evidence, significant deficiencies, management response, and next steps…">${esc(e.narrative||"")}</textarea></section><section class="panel" style="margin-top:18px"><div class="eyebrow">APPROVAL HISTORY</div><h2 class="serif">Local attestation record</h2>${e.approvals.length?e.approvals.slice().reverse().map(a=>`<div class="approval"><div class="approval-icon">${a.action==="approved"?"✓":a.action==="rejected"?"×":"↗"}</div><div><div class="title">${pretty(a.action)} by ${esc(a.signer)}</div><div class="meta">${date(a.at)}${a.signature?` · e-signature: ${esc(a.signature)}`:""}</div><p class="small" style="margin:6px 0 0">${esc(a.statement)}</p></div></div>`).join(""):`<p class="sub" style="margin-top:16px">No local submissions, approvals, or signatures recorded.</p>`}</section>`}
  function guide(){return `<div class="layout-two"><section class="panel"><div class="eyebrow">OFFLINE GUIDANCE</div><h2 class="serif">Ask Manu for a drafting cue</h2><p class="sub">This local helper uses deterministic prompts only. It does not connect to hosted AI, an LLM endpoint, or any external service.</p><div class="field" style="margin-top:18px"><label>Audit question or drafting topic</label><textarea id="guideQuestion" placeholder="Example: Draft a factual finding for missing CDD evidence."></textarea></div><button class="button primary" id="runGuide" style="margin-top:14px">Generate local guidance</button><div id="guideAnswer" class="guide-answer" style="margin-top:14px;display:none"></div></section><section class="panel"><div class="eyebrow">BOUNDARY</div><h2 class="serif">No hosted AI</h2><p class="sub">The standalone edition deliberately avoids external AI dependencies. It can offer structured drafting cues, but it cannot answer open-ended questions or validate jurisdiction-specific law without a separately configured service.</p><div class="notice" style="margin-top:17px">Do not enter unnecessary personal, customer, or confidential data into any audit drafting tool.</div></section></div>`}
  function settings(){return `<div class="layout-two"><section class="panel"><div class="eyebrow">LOCAL BACKUP</div><h2 class="serif">Protect browser-held data</h2><p class="sub">Export a backup before clearing browser data or moving to a different browser profile. Backup files can be imported into another copy of this standalone HTML file.</p><div class="toolbar"><button class="button primary" id="exportBackup">Download backup JSON</button><label class="button">Restore backup<input id="restoreBackup" type="file" accept="application/json,.json" style="display:none"></label></div><div class="notice warn">Browser storage is device- and browser-profile-specific. Losing it, clearing it, or using private mode may erase this workspace unless a backup is retained.</div></section><section class="panel"><div class="eyebrow">LOCAL DEMONSTRATION ROLE</div><h2 class="serif">Current role: ${pretty(state.role)}</h2><p class="sub">The role selector changes local screen permissions for testing workflow. It does not authenticate users or protect data from a person who can access this browser profile.</p><div class="divider"></div><button class="button danger" id="clearData">Delete all local workspace data</button></section></div><section class="panel" style="margin-top:18px"><div class="eyebrow">STANDALONE CAPABILITY BOUNDARIES</div><h2 class="serif">What this file does and does not do</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>Available locally</th><th>Requires a hosted or secured deployment</th></tr></thead><tbody><tr><td>Engagements, controls, findings, small workpapers, CSV/XLSX mapping, local reports, local approval log, backup/export</td><td>Real multi-user access control, OAuth, cloud storage, shared synchronization, server-side audit trail, notifications, large-file storage</td></tr><tr><td>Deterministic drafting cues and guided report sections</td><td>Live AI assistance or jurisdiction-specific research without a separately configured service</td></tr></tbody></table></div></section><p class="footer-note">This standalone edition is intentionally self-contained and does not rely on hosted platforms or external AI tools. Browser-local controls should not be treated as enterprise security controls.</p>`}
function bind(){document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{view=b.dataset.nav;render();});const ep=document.querySelector("#engagementPick");if(ep)ep.onchange=()=>{state.selectedId=ep.value||null;save();};const rp=document.querySelector("#rolePick");if(rp)rp.onchange=()=>{state.role=rp.value;save();};document.querySelectorAll("[data-select]").forEach(b=>b.onclick=()=>{state.selectedId=b.dataset.select;view="checklist";save();});document.querySelectorAll("[data-status-eng]").forEach(s=>s.onchange=()=>{const e=state.engagements.find(x=>x.id===s.dataset.statusEng);e.status=s.value;save();});const form=document.querySelector("#engagementForm");if(form)form.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));const n=newEngagement(d);state.engagements.push(n);state.selectedId=n.id;toast("Local engagement created.");save();};document.querySelectorAll("[data-control-status]").forEach(s=>s.onchange=()=>{const c=selected().controls.find(x=>x.id===s.dataset.controlStatus);c.status=s.value;save();});document.querySelectorAll("[data-control-note]").forEach(t=>t.onchange=()=>{const c=selected().controls.find(x=>x.id===t.dataset.controlNote);c.note=t.value;save();});const ff=document.querySelector("#findingForm");if(ff)ff.onsubmit=x=>{x.preventDefault();const d=Object.fromEntries(new FormData(ff));selected().findings.push({id:uid("fnd"),reference:d.reference,title:d.title,summary:d.summary,severity:d.severity,owner:d.owner,dueDate:d.dueDate,status:"open"});toast("Deficiency saved locally.");save();};document.querySelectorAll("[data-finding-status]").forEach(s=>s.onchange=()=>{const f=selected().findings.find(x=>x.id===s.dataset.findingStatus);f.status=s.value;save();});const wf=document.querySelector("#workpaperFile");if(wf)wf.onchange=()=>readWorkpaper(wf.files[0]);document.querySelectorAll("[data-download-workpaper]").forEach(b=>b.onclick=()=>downloadWorkpaper(b.dataset.downloadWorkpaper));document.querySelectorAll("[data-delete-workpaper]").forEach(b=>b.onclick=()=>{const e=selected();e.workpapers=e.workpapers.filter(w=>w.id!==b.dataset.deleteWorkpaper);save();});const it=document.querySelector("#importType");if(it)it.onchange=()=>{pending=null;pending={type:it.value};render();};const fi=document.querySelector("#importFile");if(fi)fi.onchange=()=>readImport(fi.files[0],it.value);const dt=document.querySelector("#downloadImportTemplate");if(dt)dt.onclick=()=>downloadTemplate(it.value);document.querySelectorAll("[data-map-field]").forEach(s=>s.onchange=()=>{pending.map[s.dataset.mapField]=s.value;});const ci=document.querySelector("#confirmImport");if(ci)ci.onclick=()=>confirmImport();const cx=document.querySelector("#cancelImport");if(cx)cx.onclick=()=>{pending=null;render();};const rf=document.querySelector("#reportFormat");if(rf)rf.onchange=()=>{selected().format=rf.value;selected().reportStatus="draft";save();};const rn=document.querySelector("#reportNarrative");if(rn)rn.onchange=()=>{selected().narrative=rn.value;save();};const dr=document.querySelector("#downloadReport");if(dr)dr.onclick=()=>downloadReport();const pr=document.querySelector("#printReport");if(pr)pr.onclick=()=>printReport();const sr=document.querySelector("#submitReport");if(sr)sr.onclick=()=>attest("submitted");document.querySelectorAll("[data-report-decision]").forEach(button=>button.onclick=()=>attest(button.dataset.reportDecision));const g=document.querySelector("#runGuide");if(g)g.onclick=()=>runGuide();const ex=document.querySelector("#exportBackup");if(ex)ex.onclick=()=>downloadBackup();const rb=document.querySelector("#restoreBackup");if(rb)rb.onchange=()=>restoreBackup(rb.files[0]);const cd=document.querySelector("#clearData");if(cd)cd.onclick=()=>{if(confirm("Delete all local The AI AML/CFT Compliance Auditor data from this browser?")){localStorage.removeItem(KEY);state=normalize({});view="dashboard";render();}};}
  async function readWorkpaper(file){if(!file)return;if(!selected())return;if(file.size>1024*1024){toast("Use a workpaper smaller than 1 MB in standalone mode.");return;}const data=await fileToData(file);selected().workpapers.push({id:uid("wp"),name:file.name,type:file.type,size:file.size,data,addedAt:new Date().toISOString()});toast("Workpaper stored in this browser.");save();}
  function fileToData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});}
  function downloadWorkpaper(id){const w=selected().workpapers.find(x=>x.id===id);const a=document.createElement("a");a.href=w.data;a.download=w.name;a.click();}
  function downloadTemplate(type){const fields=importSchemas[type];const blob=new Blob([fields.join(",")+"\n"],{type:"text/csv"});download(blob,`${pretty(type).replaceAll(" ","_")}_Template.csv`);}
  async function readImport(file,type){if(!file)return;try{let rows;if(file.name.toLowerCase().endsWith(".xlsx"))rows=await parseXlsx(await file.arrayBuffer());else rows=parseCsv(await file.text());if(!rows.length){toast("No data rows were found.");return;}const columns=[...new Set(rows.flatMap(r=>Object.keys(r)))];const map={};importSchemas[type].forEach(f=>map[f]=columns.find(c=>c.trim().toLowerCase()===f.toLowerCase())||"");pending={type,name:file.name,source:file.name.toLowerCase().endsWith(".xlsx")?"XLSX":"CSV",rows,columns,map};render();toast("Review the required field mapping.");}catch(err){console.error(err);toast("The file could not be read. Use CSV or a standard XLSX file.");}}
  function parseCsv(text){const rows=[];let row=[],cell="",quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'&&quoted&&next==='"'){cell+='"';i++;}else if(ch==='"'){quoted=!quoted;}else if(ch===","&&!quoted){row.push(cell);cell="";}else if((ch==="\n"||ch==="\r")&&!quoted){if(ch==="\r"&&next==="\n")i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell="";}else cell+=ch;}if(cell||row.length){row.push(cell);rows.push(row);}const headers=(rows.shift()||[]).map(h=>h.trim());return rows.filter(r=>r.some(v=>String(v).trim())).map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]||"").trim()])));}
  async function parseXlsx(buffer){const files=await unzip(new Uint8Array(buffer));const shared=files["xl/sharedStrings.xml"]?xmlTextArray(files["xl/sharedStrings.xml"],"si"):[];const sheetName=Object.keys(files).find(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n));if(!sheetName)throw new Error("No worksheet found");const doc=new DOMParser().parseFromString(new TextDecoder().decode(files[sheetName]),"application/xml");const raw=[];doc.querySelectorAll("row").forEach(row=>{const vals=[];row.querySelectorAll("c").forEach(c=>{const ref=c.getAttribute("r")||"A1",letters=ref.match(/[A-Z]+/)[0];let col=0;for(const l of letters)col=col*26+l.charCodeAt(0)-64;let value="";const v=c.querySelector("v");if(c.getAttribute("t")==="s")value=shared[Number(v?.textContent||0)]||"";else if(c.getAttribute("t")==="inlineStr")value=c.querySelector("is")?.textContent||"";else value=v?.textContent||"";vals[col-1]=value;});raw.push(vals);});const headers=(raw.shift()||[]).map(v=>String(v||"").trim());return raw.filter(r=>r.some(v=>String(v||"").trim())).map(r=>Object.fromEntries(headers.map((h,i)=>[h,String(r[i]||"").trim()])));}
  function xmlTextArray(bytes,tag){const d=new DOMParser().parseFromString(new TextDecoder().decode(bytes),"application/xml");return [...d.querySelectorAll(tag)].map(n=>n.textContent||"");}
  async function unzip(data){let end=-1;for(let i=data.length-22;i>=Math.max(0,data.length-65557);i--)if(new DataView(data.buffer).getUint32(i,true)===0x06054b50){end=i;break;}if(end<0)throw new Error("Invalid XLSX archive");const dv=new DataView(data.buffer),count=dv.getUint16(end+10,true),offset=dv.getUint32(end+16,true),out={};let p=offset;for(let n=0;n<count;n++){if(dv.getUint32(p,true)!==0x02014b50)throw new Error("Invalid XLSX directory");const method=dv.getUint16(p+10,true),size=dv.getUint32(p+20,true),nameLen=dv.getUint16(p+28,true),extra=dv.getUint16(p+30,true),comment=dv.getUint16(p+32,true),local=dv.getUint32(p+42,true),name=new TextDecoder().decode(data.slice(p+46,p+46+nameLen));const lName=dv.getUint16(local+26,true),lExtra=dv.getUint16(local+28,true),start=local+30+lName+lExtra,part=data.slice(start,start+size);out[name]=method===0?part:method===8?new Uint8Array(await new Response(new Blob([part]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer()):(()=>{throw new Error("Unsupported XLSX compression")})();p+=46+nameLen+extra+comment;}return out;}
  function validate(type,records){const req=importSchemas[type],issues=[],valid=[],seen=new Set;const dateFields=new Set(["DOB","ID_Expiry","Date","Hire_Date","Training_Date","Filing_Date","Response_Date"]);records.forEach((r,index)=>{const row=index+2,errs=[];req.forEach(f=>{if(!String(r[f]||"").trim())errs.push(`${f}: required`);});Object.entries(r).forEach(([k,v])=>{if(dateFields.has(k)&&v&&!Number.isFinite(Date.parse(v)))errs.push(`${k}: invalid date`);});const key=r[req[0]];if(key&&seen.has(key))errs.push(`${req[0]}: duplicate identifier`);if(key)seen.add(key);if(type==="transactions"&&(!Number.isFinite(Number(String(r["Amount (XCD)"]||"").replaceAll(",","")))||Number(String(r["Amount (XCD)"]||"").replaceAll(",",""))<=0))errs.push("Amount (XCD): positive number required");if(type==="customers"&&r.Risk_Rating&&!["low","medium","high"].includes(String(r.Risk_Rating).toLowerCase()))errs.push("Risk_Rating: Low, Medium, or High");if(errs.length)issues.push(`Row ${row}: ${errs.join("; ")}`);else valid.push(r);});return {valid,issues};}
  function confirmImport(){if(!pending)return;const missing=importSchemas[pending.type].filter(f=>!pending.map[f]);if(missing.length){toast("Map every required field before import.");return;}const records=pending.rows.map(r=>Object.fromEntries(importSchemas[pending.type].map(f=>[f,r[pending.map[f]]||""]))),result=validate(pending.type,records),e=selected();e.imports.push({id:uid("imp"),name:pending.name,source:pending.source,type:pending.type,totalRows:records.length,validRows:result.valid.length,issues:result.issues,records:result.valid,importedAt:new Date().toISOString()});pending=null;toast(`${result.valid.length} valid row(s) added; ${result.issues.length} exception(s) recorded.`);save();}
  function attest(action){const e=selected();if(action!=="submitted"&&state.role!=="admin"){toast("Only the local administrator role can approve or reject.");return;}const signer=prompt(action==="submitted"?"Prepared by (name):":"Administrator name:","Local reviewer");if(!signer)return;const statement=prompt("Attestation statement:",action==="submitted"?"I attest that this report is ready for local administrator review.":action==="approved"?"I approve this report after review of its local engagement record.":"I reject this report for revision.");if(!statement)return;const signature=action==="submitted"?"":prompt("Type an electronic signature:",signer);if(action!=="submitted"&&!signature)return;e.approvals.push({id:uid("apr"),action,signer,signature,statement,at:new Date().toISOString()});e.reportStatus=action==="submitted"?"pending_approval":action;toast(`Report ${action}. Local attestation recorded.`);save();}
  function reportHtml(e){const f=formats[e.format]||formats.universal;return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(e.name)} — ${esc(f.name)}</title><style>body{font-family:Arial,sans-serif;color:#24332d;max-width:850px;margin:48px auto;line-height:1.55}h1{font-family:Georgia,serif;color:#173b36}h2{margin-top:30px;border-bottom:1px solid #ddd;padding-bottom:6px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ddd;padding:8px;text-align:left;vertical-align:top}th{background:#edf2ee}.meta{color:#61716a}.notice{background:#fff8e5;border-left:4px solid #c99534;padding:12px}</style></head><body><p class="meta">THE AI AML/CFT COMPLIANCE AUDITOR · STANDALONE EDITION · ${esc(f.regulator)}</p><h1>${esc(e.name)}</h1><p class="meta">${esc(e.entityName)} · ${esc(e.entityType)} · ${esc(e.jurisdiction)}</p><div class="notice">This is a browser-local working template. Confirm current regulator requirements and retain a separate secure backup before external use.</div><h2>Report format outline</h2><ol>${f.sections.map(s=>`<li>${esc(s)}</li>`).join("")}</ol><h2>Executive summary</h2><p>${esc(e.narrative||"Complete the scope, evidence, findings, conclusion, and priority actions.")}</p><h2>Engagement profile</h2><table><tr><th>Status</th><td>${esc(pretty(e.status))}</td><th>Report status</th><td>${esc(pretty(e.reportStatus))}</td></tr><tr><th>Risk score</th><td>${risk(e)}/100</td><th>Period</th><td>${esc(date(e.startDate))} – ${esc(date(e.endDate))}</td></tr></table><h2>Control testing</h2><table><tr><th>Reference</th><th>Control</th><th>Status</th><th>Evidence note</th></tr>${e.controls.map(c=>`<tr><td>${esc(c.code)}</td><td>${esc(c.title)}</td><td>${esc(pretty(c.status))}</td><td>${esc(c.note)}</td></tr>`).join("")}</table><h2>Deficiencies and remediation</h2><table><tr><th>Reference</th><th>Finding</th><th>Severity</th><th>Status</th></tr>${e.findings.map(x=>`<tr><td>${esc(x.reference)}</td><td><b>${esc(x.title)}</b><br>${esc(   function reportHtmlWithIfrs(e){const draft=e.reportAuthoring||{},content=`<h2>IFRS SME-informed authoring record</h2><p class="meta">This AML/CFT working report uses a guided authoring structure adapted from the supplied IFRS SME report writer. It is not a set of IFRS financial statements.</p><table><tr><th>Authoring block</th><th>Local report content</th></tr>${ifrsSmeBlocks.map(([title],index)=>`<tr><td><b>${esc(title)}</b></td><td>${esc(draft[`block${index}`]||"Not completed.")}</td></tr>`).join("")}</table>`;return reportHtml(e).replace("</body>",`${content}</body>`);}

  function runGuide(){const q=(document.querySelector("#guideQuestion").value||"").trim().toLowerCase(),out=document.querySelector("#guideAnswer");if(!q){toast("Enter a drafting topic first.");return;}let a="Use a factual structure: condition, evidence, impact, recommendation, owner, and due date. Avoid conclusions that exceed the evidence recorded in the engagement.";if(/cdd|customer|identity|kyc/.test(q))a="CDD drafting cue:\n1. State the affected population or sample.\n2. Identify the missing or inconsistent identity / verification evidence.\n3. Explain the control and regulatory exposure without asserting legal conclusions.\n4. Recommend a documented remediation owner, due date, and validation step.";else if(/monitor|transaction|str|suspicious/.test(q))a="Monitoring and reporting cue:\nDescribe the monitoring rule or escalation process tested, the observed evidence, the control gap, and the recommended process or record-retention improvement. Preserve confidentiality of customer and reportable information.";else if(/finding|deficien|remedi/.test(q))a="Finding drafting cue:\nCondition: what was observed.\nCriteria: the policy, procedure, or control expectation.\nCause: only where evidenced.\nImpact: the risk created.\nRecommendation: clear action, accountable owner, target date, and validation method.";out.textContent=a;out.style.display="block";}

  function openPasswordChange(){const modal=document.querySelector("#modal");modal.innerHTML=`<div class="modal-card"><div class="eyebrow">LOCAL ACCESS CONTROL</div><h2 class="serif">Change local password</h2><p class="sub">Your existing browser-local workspace remains in place. The new password is stored only as a local verifier.</p><form id="changePasswordForm" class="form-grid"><div class="field full"><label>Current password<input type="password" name="current" required autocomplete="current-password"></label></div><div class="field"><label>New password<input type="password" name="next" required minlength="12" autocomplete="new-password"></label></div><div class="field"><label>Confirm new password<input type="password" name="confirm" required minlength="12" autocomplete="new-password"></label></div><div class="field full"><div class="toolbar"><button class="button primary">Save new password</button><button class="button" type="button" id="closePasswordModal">Cancel</button></div></div></form></div>`;modal.classList.add("open");document.querySelector("#closePasswordModal").onclick=()=>modal.classList.remove("open");document.querySelector("#changePasswordForm").onsubmit=async event=>{event.preventDefault();const d=Object.fromEntries(new FormData(event.currentTarget));if(d.next!==d.confirm){toast("The new passwords do not match.");return;}if(String(d.next).length<12){toast("Use at least 12 characters.");return;}if(!(await verifyPassword(d.current))){toast("The current password is not correct.");return;}await setPassword(d.next);modal.classList.remove("open");toast("Local password changed.");};}
